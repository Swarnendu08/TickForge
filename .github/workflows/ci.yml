name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'contrib/**'
  pull_request:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror main.cpp -o tickforge

      - name: Run smoke test
        run: ./tickforge
