name: Delete merged contributor branches

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-branch:
    # Only merged, same-repository contrib branches are eligible. Feature branches
    # and branches marked keep-branch are retained.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'contrib/') &&
      !contains(github.event.pull_request.labels.*.name, 'keep-branch')
    runs-on: ubuntu-latest

    steps:
      - name: Delete merged contributor branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const { owner, repo } = context.repo;

            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status === 404) {
                core.info(`Branch ${branch} is already deleted.`);
                return;
              }
              throw error;
            }

            await github.rest.git.deleteRef({
              owner,
              repo,
              ref: `heads/${branch}`,
            });
            core.info(`Deleted merged contributor branch ${branch}.`);
